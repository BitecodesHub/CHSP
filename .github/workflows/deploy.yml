name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Create deployment directory
        run: |
          mkdir -p _site
          cp index.html _site/
          cp .nojekyll _site/
          # Copy template files if they exist (they're embedded in index.html)
          [ -f tmpl_head.html ] && cp tmpl_head.html _site/ || echo "tmpl_head.html not found, skipping"
          [ -f tmpl_body.html ] && cp tmpl_body.html _site/ || echo "tmpl_body.html not found, skipping"
          [ -f tmpl_script.js ] && cp tmpl_script.js _site/ || echo "tmpl_script.js not found, skipping"
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
